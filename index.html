<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>郭鑫怡的脑回路大冒险</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#fff0f7,#f0edff);font-family:system-ui,"Microsoft YaHei",sans-serif;color:#302847;display:flex;justify-content:center}main{width:min(100%,760px);padding:16px}h1{text-align:center;font-size:clamp(24px,6vw,36px);margin:8px 0}.sub,.help{text-align:center;color:#716687}.hud,.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:12px 0}.pill{background:white;border:2px solid #e5dcff;border-radius:30px;padding:8px 12px;font-weight:bold}canvas{display:block;width:100%;border:3px solid white;border-radius:18px;box-shadow:0 8px 22px #8e7ac533;touch-action:none}button{border:0;border-radius:15px;padding:13px 18px;font:inherit;font-weight:bold;background:white;color:#302847;box-shadow:0 4px #d9cff7;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px #d9cff7}.controls button{min-width:75px;font-size:21px}#jump{background:#ffe16b}#restart{display:block;margin:auto;background:#8ce8cf}.note{margin-top:14px;background:white;border:2px dashed #dfd4ff;border-radius:15px;padding:12px;line-height:1.6}#message{font-weight:bold;color:#7959d9}
</style></head><body><main><h1>🌈 郭鑫怡的脑回路大冒险</h1><p class="sub">收集灵感碎片，躲开离谱小怪，抵达快乐终点！</p>
<div class="hud"><span class="pill">🧠 灵感：<b id="score">0</b>/8</span><span class="pill">💖 状态：<b id="lives">3</b></span></div>
<canvas id="game" width="720" height="400"></canvas><p class="help">电脑：← → 移动，空格跳跃｜手机：使用下面按钮</p>
<div class="controls"><button id="left">⬅️</button><button id="jump">⬆️ 跳跃</button><button id="right">➡️</button></div><button id="restart">重新开始</button>
<div class="note"><span id="message">任务：收集 8 个脑回路碎片！</span><br>小心鸭子、袜子和黄瓜怪！集齐碎片就能解锁郭鑫怡的专属结局。</div>
<script>
(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),W=720,H=400,floor=345;let keys={},score=0,lives=3,won=false,over=false,frame=0,p,items,enemies;
const $=id=>document.getElementById(id);function reset(){score=0;lives=3;won=over=false;frame=0;p={x:45,y:290,w:34,h:42,vy:0,on:false,inv:0};items=Array.from({length:8},(_,i)=>({x:125+i*77,y:250-(i%3)*48,taken:false}));enemies=[{x:235,y:318,w:34,v:1.5,min:205,max:315,e:'🦆'},{x:425,y:317,w:34,v:-1.7,min:395,max:520,e:'🧦'},{x:585,y:317,w:34,v:1.4,min:550,max:665,e:'🥒'}];hud();$('message').textContent='任务：收集 8 个脑回路碎片！'}
function hud(){$('score').textContent=score;$('lives').textContent=lives}
function bg(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#baf0ff');g.addColorStop(1,'#fff1d9');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#ffffffaa';[[80,65,28],[255,90,22],[530,55,30],[640,115,18]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.arc(a+r,b+6,r*.8,0,7);x.fill()});x.fillStyle='#9ce6b6';x.beginPath();x.moveTo(0,300);x.quadraticCurveTo(130,240,240,305);x.quadraticCurveTo(390,250,520,300);x.quadraticCurveTo(630,245,720,292);x.lineTo(720,400);x.lineTo(0,400);x.fill();x.fillStyle='#77d8a3';x.fillRect(0,floor,W,55);x.fillStyle='#5ac48a';for(let a=0;a<W;a+=24)x.fillRect(a,355,12,4);x.fillStyle='#fff';x.font='bold 15px system-ui';x.fillText('脑回路公园',18,28)}
function draw(){bg();items.forEach(it=>{if(it.taken)return;x.fillStyle='#ffe16b';x.strokeStyle='white';x.lineWidth=3;x.beginPath();x.arc(it.x,it.y+Math.sin(frame/12+it.x)*3,17,0,7);x.fill();x.stroke();x.font='20px system-ui';x.textAlign='center';x.fillText('🧠',it.x,it.y+7)});enemies.forEach(e=>{x.font='30px system-ui';x.textAlign='center';x.fillText(e.e,e.x+17,e.y+25)});x.save();x.translate(p.x,p.y);if(p.inv&&Math.floor(frame/4)%2===0)x.globalAlpha=.4;x.fillStyle='#ff75ae';x.strokeStyle='white';x.lineWidth=3;x.beginPath();x.roundRect(0,4,p.w,p.h-4,12);x.fill();x.stroke();x.fillStyle='white';x.beginPath();x.arc(11,18,5,0,7);x.arc(24,18,5,0,7);x.fill();x.fillStyle='#302847';x.beginPath();x.arc(12,19,2,0,7);x.arc(23,19,2,0,7);x.fill();x.font='17px system-ui';x.fillText('⭐',8,-2);x.restore();if(won||over){x.fillStyle='#342b58bb';x.fillRect(0,0,W,H);x.fillStyle='white';x.textAlign='center';x.font='bold 31px system-ui';x.fillText(won?'🎉 通关成功！':'再试一次！',W/2,160);x.font='20px system-ui';x.fillText(won?'郭鑫怡，愿你的快乐和灵感一直满格！':'脑回路暂时离家出走啦～',W/2,205);x.font='16px system-ui';x.fillText(won?'你解锁了专属快乐结局':'点击下方重新开始',W/2,242)}}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function update(){if(won||over)return;frame++;p.vx=keys.left?-3.4:keys.right?3.4:0;p.x=Math.max(0,Math.min(W-p.w,p.x+p.vx));p.vy+=.48;p.y+=p.vy;if(p.y+p.h>=floor){p.y=floor-p.h;p.vy=0;p.on=true}else p.on=false;if(p.inv)p.inv--;enemies.forEach(e=>{e.x+=e.v;if(e.x<e.min||e.x>e.max)e.v*=-1;if(hit(p,{x:e.x+4,y:e.y+3,w:e.w-8,h:24})&&!p.inv){lives--;p.inv=70;p.vy=-6;hud();if(lives<=0){over=true;$('message').textContent='再试一次，快乐闯关不放弃！'}}});items.forEach(it=>{if(!it.taken&&hit(p,{x:it.x-14,y:it.y-14,w:28,h:28})){it.taken=true;score++;hud();if(score===8){won=true;$('message').textContent='通关啦！郭鑫怡的快乐值已拉满！'}}})}
function loop(){update();draw();requestAnimationFrame(loop)}function jump(){if(p.on&&!won&&!over){p.vy=-10;p.on=false}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump()});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
function hold(id,k){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}))}hold('left','left');hold('right','right');$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});$('restart').onclick=reset;reset();loop()})();
</script></main></body></html>
